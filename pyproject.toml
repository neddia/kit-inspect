[project]
name = "kit-inspect"
version = "0.1.0"
requires-python = ">=3.12"
# Needed on BOTH machines. torch itself is not listed here: which build of it
# you get (CUDA or CPU-only) depends on the group below.
dependencies = [
    "cpppo==5.2.5",          # simulated PLC (EtherNet/IP server)
    "fastapi==0.162.5",
    "matplotlib==3.10.9",
    "opencv-python==5.0.0.93",
    "openvino==2026.4.1",
    "pandas==2.3.3",
    "pylogix==1.1.7",        # vision-side PLC client (pycomm3 can't talk to cpppo)
    "pyyaml==6.0.3",
    "transformers==5.20.2",
    "ultralytics==8.4.213",
    "uvicorn==0.54.0",
]

[dependency-groups]
# Training PC: CUDA build of PyTorch (~6 GB, with its NVIDIA libraries) for GPU training and SAM 3.
train = [
    "anomalib==2.7.1",
    "clip",
    "nncf==3.4.0",           # INT8 quantization for the OpenVINO export (export runs on the PC)
    "timm==1.0.31",
    "torch==2.14.1",
    "torchvision==0.29.2",
]
# Station laptop: CPU-only PyTorch (much smaller). Inference runs through OpenVINO.
prod = [
    "torch==2.14.1",
    "torchvision==0.29.2",
]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
# `uv sync` with no flags = the training PC setup.
# Laptop: `uv sync --no-default-groups --group prod`
default-groups = ["train", "dev"]
# train and prod pick different torch builds, so they can't be installed together.
conflicts = [[{ group = "train" }, { group = "prod" }]]
# Both machines run x86-64 Linux (PC: WSL2 Ubuntu, laptop: Omarchy).
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# anomalib asks for opencv-python-headless (OpenCV without windows). Installed next to
# opencv-python it can overwrite it and break the capture/review windows, so never
# install it; opencv-python provides the same cv2 module.
override-dependencies = ["opencv-python-headless; sys_platform == 'never'"]

[tool.uv.sources]
# train group: no entry here, so it comes from PyPI, whose Linux build of
# torch 2.14.1 is already the CUDA 13.0 build.
torch = [{ index = "pytorch-cpu", group = "prod" }]
torchvision = [{ index = "pytorch-cpu", group = "prod" }]
clip = { git = "https://github.com/ultralytics/CLIP.git", rev = "7ffa84b3bfa40c42ecc1c77147a855e69cb2dd40" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true   # only used for packages that name it above

[tool.pytest.ini_options]
pythonpath = ["."]   # so tests can `import src...` from the repo root
testpaths = ["tests"]
