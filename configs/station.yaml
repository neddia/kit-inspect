# Station settings. Sections get filled in as stages need them:
#   camera:     Stage 1 (below)
#   thresholds: Stage 6 (confidence, REVIEW band)
#   plc:        Stage 7 (below)

camera:
  usb_id: "046d:081d"      # live station rediscovers this webcam after unplug
  device: /dev/video0      # Logitech C510 (USB 046d:081d)
  width: 1280              # 720p is the sensor's real resolution; bigger sizes are upscaled
  height: 720
  fourcc: MJPG             # compressed; YUYV (uncompressed) stalls through WSL USB passthrough
  fps: 15                  # On WSL, 720p at 30 fps delivers NO frames; 15 fps is steady (tested Nov 15).
                           # We save single frames, so 15 is plenty. Keep exposure under 1/fps (660 at 15 fps).
  # The camera FORGETS these on every unplug/reboot, so camera.py applies them
  # on every open and reads them back. Order matters: switch auto modes off
  # before setting the manual values, or the camera ignores them.
  # Exposure and white balance values are placeholders until the rig is built.
  controls:
    auto_exposure: 1                 # 1 = manual (3 = auto)
    exposure_dynamic_framerate: 0    # don't slow the frame rate in dim light
    white_balance_automatic: 0
    exposure_time_absolute: 20       # 3-660, in 0.1 ms. Tuned Nov 15 for the desk lamp; retune if the light changes.
    white_balance_temperature: 4000  # 2800-6500 K. Nov 15: white paper is most neutral at 4000-4400.
    gain: 16                         # 16-255 in practice: while streaming, anything below 16 snaps to 16
                                     # (camera claims 0 is the minimum). Digital brightening adds noise; keep low.
    backlight_compensation: 0
    zoom_absolute: 2                 # 1-5. Crops the sensor (real detail, unlike a software crop).
    pan_absolute: 0                  # pan/tilt move the zoomed window around; keep centred
    tilt_absolute: 0
  # No focus control: the C510 is fixed-focus. Set the camera height so the tray is sharp.

inspection:                # Stage 6. Every number here is chosen on train/val data; freeze before the test sessions.
  model: models/kit_yolo26n_640_v3_openvino_model   # v3, 4 classes (bolt, nut, screw, other = junk), Nov 18-19.
                          # v2 + train06 (KIT tags in view, nuts touching parts, stacked nuts, bolts tip to tip).
                          # vs v2: boxes on the KIT tag in 92 station photos 215 -> 1; false passes 0 on hardval2,
                          # val01, hardval (both); hardval2 good kits failed 2/6 -> 1/6. FROZEN for test01.
                          # OpenVINO FP32 (same decisions as the .pt, faster on CPU). Not INT8: it dropped a
                          # touching screw on v1 (val01_0036). Rebuild: uv run kit train v3 (or yolo export ... format=openvino)
                          # Previous: models/kit_yolo26n_640_v2_4cls_openvino_model (no tags in its training photos).
  imgsz: 640               # must match training
  decision:
    low: 0.2               # detections below this are noise (ignored)
    high: 0.7              # at or above: SURE. Between low and high: UNSURE (REVIEW if it could change the answer)
                           # Chosen Nov 17 from val01: noise <= 0.11, shakiest real part 0.27, worst false 0.57,
                           # weakest real part on a normal tray 0.81. Each line sits mid-gap for margin.
                           # Rechecked Nov 18 for v2_4cls: val01 still clean (real parts >= 0.81 except a
                           # screw at 0.66), but on hard good kits a bolt head reads as "nut" at 0.60-0.78.
                           # high 0.75 turned 1 hardval false reject into a REVIEW, fixed none on hardval2
                           # (those are MISSED nuts: no threshold helps). Kept 0.7: one tray isn't a reason.
    max_nut_side_px: {KIT-A: 92}  # Isolated regular nuts, excluding stacked trays: 98th percentile (87.234 px) + 5%, rounded.
    max_screw_diagonal_px: {KIT-A: 206.22}  # Largest isolated regular screw diagonal + 5%.
    min_screw_diagonal_px: {KIT-A: 160}  # 4% below the smallest isolated regular training screw (166.9 px).
    min_nut_side_px: {KIT-A: 60}  # Fixed webcam rig. A smaller box may be occluded: request REVIEW.
    overlap_iou: 0.6       # a detection overlapping a more confident one this much counts as unsure
  scene:
    min_brightness: 140    # flat-floor median brightness; train/val range was 150-248
    max_brightness: 252
    max_floor_outside: 0.10  # tray off position if more than 10% of the floor radius is outside the photo
  label:                   # kit label OCR (src/inspection/kit_label.py), Nov 18
    enabled: true          # ON since Nov 18 (labels printed). A tray without a label goes to REVIEW.
                           # decision_eval turns it off (older sessions have no labels); --label turns it on.
    min_conf: 0.8          # OCR confidence below this = "unreadable" -> REVIEW
    near: [0.85, 1.3]      # a label is ON the tray if its centre is this many rim radii from the bowl centre.
                           # Real label (stuck on the bowl wall) read at 1.05 (Nov 18). Bench labels measured
                           # at 1.59-1.72 stay out. The rim estimate moves ~10% with bright labels near it.
    threads: 2             # CPU threads for the OCR (OpenVINO); ~135 ms per 720p frame on 2 cores (PC)
  leftovers:               # OpenCV unknown-object check (src/inspection/leftovers.py). Chosen over PatchCore Nov 17 (speed)
    neighbourhood: 82
    darker_by: 35
    saturation: 45         # was 60: a pale green bead (saturation ~55) slipped through on the live station, Nov 17.
                           # White floor is 22-34; 45 = mid-gap. No new false alarms on 252 train/val trays.
    box_margin: 20
    min_area: 150
    edge_low: 40           # Canny edge test (Nov 18): silver coin on the white floor = no contrast, only a boundary.
    edge_high: 80          # 0 = off. Same results from 20/40 to 60/120. Junk 72 -> 78 of 86, false alarms unchanged.
    edge_shrink: 25        # px: the floor-to-wall boundary is an edge too, so stay this far inside it
    below_floor: 10        # a 'darker' pixel must also be this far below the floor's brightness (Nov 18: floor
                           # between shiny nuts looked 'darker'). 5 clears it, 15 loses junk; 10 = mid-gap

plc:
  simulated: true         # The PLC is a Python simulator, not real hardware.
  host: 127.0.0.1          # where the PLC (simulator) listens; EtherNet/IP port 44818
  port: 44818
  timeout_s: 2.0           # No Insp_Done within this time = hold (no result). Tune once latency is measured.
  heartbeat_ms: 500        # Vision_Heartbeat toggle period.
  heartbeat_timeout_s: 2.0 # PLC side: no heartbeat toggle for this long = vision fault, block release.
  poll_ms: 10              # how often each side checks the tags
  tags:
    trigger: Insp_Trigger
    cycle_id: Insp_CycleID
    busy: Insp_Busy
    result: Insp_Result              # 1 = PASS, 2 = FAIL, 3 = REVIEW
    result_cycle_id: Insp_ResultCycleID
    kit_id: Insp_KitID               # DINT code, mapped in kits.yaml `codes` (1 = KIT-A)
    done: Insp_Done
    ack: Insp_Ack
    heartbeat: Vision_Heartbeat
    fault: Vision_Fault
    release_permit: Release_Permit
