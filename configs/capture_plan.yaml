# The shot list for guided capture (src/capture/guided.py).
# Sessions run in this order; the script remembers where you are (it reads the
# manifest), so you can quit and come back. Edit freely BEFORE shooting a session.
#
# Each session:
#   name, split (train/val/test), tier (normal/stress/invalid, default normal)
#   setup:  what to change before the session starts (shown full-screen, ENTER to begin)
#   loose:  true = set the tray down loosely (±2 cm, slightly rotated) every shot
#   hint:   extra instruction shown on every shot
#   mix:    shots per scenario, IN THIS ORDER (default: default_mix below).
#           Scenarios: complete, missing_<part>, extra_part, two_faults,
#           foreign_object, stacked, empty, swap_<part> (smaller sibling),
#           lookalike_<part> (a look-alike in its place, e.g. a coin cell for a nut)
#   pauses: {shot number: "what to change"} -- stop mid-session for a change
#
# All sessions are shot on one day (Nov 16), so the conditions are made
# physically different instead of waiting for different days. Note it in the report.

kit: KIT-A

default_mix:          # 40 shots, grouped so you change the parts as rarely as possible
  complete: 16
  missing_bolt: 4
  missing_nut: 3
  missing_screw: 4
  extra_part: 4
  two_faults: 2
  foreign_object: 4
  stacked: 2
  empty: 1

stress_mix:           # 15 shots
  complete: 6
  missing_bolt: 2
  missing_nut: 2
  missing_screw: 2
  extra_part: 2
  two_faults: 1

sessions:
  - name: train01
    split: train
    setup: "BASELINE: room lights ON, fixture lamp at its normal level, window closed"

  - name: train02
    split: train
    setup: "ROOM LIGHTS OFF: fixture lamp only"

  - name: train03
    split: train
    setup: "DAYLIGHT: open the window/blinds, room lights off, lamp normal"
    loose: true

  - name: train04
    split: train
    setup: "BRIGHTER: turn the fixture lamp UP, room lights on, window closed"
    loose: true

  - name: train05
    split: train
    setup: "CAMERA MOVED: tilt the camera a few degrees (don't touch settings), lamp normal"
    loose: true

  - name: val01
    split: val
    setup: "VALIDATION, mixed: camera back to roughly normal, room lights on, lamp normal"
    loose: true
    pauses:
      14: "Room lights OFF (lamp only)"
      27: "Window open / daylight, lamp a bit brighter"

  # ---- Hard cases (Nov 17): what the live station got wrong or nearly wrong ----
  # Shoot with: uv run python -m src.capture.guided --verdict   (shows the model's answer each shot)
  - name: hard01
    split: train
    setup: "HARD CASES 1, LOOK-ALIKES: normal light. Have coin cells, coins, washers, the bead ready"
    hint: "junk = mostly LOOK-ALIKES (coin cell, coin, washer); sometimes touching a part"
    mix: {foreign_object: 40, complete: 10}
  - name: hard02
    split: train
    setup: "HARD CASES 2, ODD POSES: normal light, no junk"
    hint: "1-2 parts in an ODD POSE: bolt standing on its head, nut on its edge. A shorter bolt/screw may stand in for one (it still counts as that part)"
    mix: {complete: 30}
  - name: hard03
    split: train
    setup: "HARD CASES 3, OVERLAP: normal light, no junk"
    hint: "parts OVERLAPPING and touching, but every part countable by eye (if you'd hesitate, it's 'stacked': redo)"
    mix: {complete: 30}
  - name: hardval
    split: val
    setup: "HARD CASES CHECK SET (never trained on): normal light; mix odd poses, overlaps and look-alikes"
    hint: "mix it up: odd poses, overlaps, look-alikes"
    mix: {complete: 8, foreign_object: 6, lookalike_nut: 4, missing_nut: 2}
  - name: hardval2
    split: test           # never trained on AND never YOLO's val (hardval was): the honest check, Nov 18
    setup: "FRESH CHECK SET for the 'other' class: normal light. Junk shots: first 5 with junk NEVER used before (drawer stuff), last 5 with coin cells/batteries in new spots"
    hint: "junk the model has never seen is the real test; complete trays: odd poses + overlap"
    mix: {complete: 6, foreign_object: 10, lookalike_nut: 4}

  # ---- Nov 18 evening, in this order: train06 -> train v3 -> pick + freeze -> labelval -> test01 ----
  - name: train06
    split: train          # what hardval2 failed on (nuts touching parts, stacked nuts, bolts tip to tip) + the kit label in view
    setup: "TRAINING: normal light, the printed KIT tag always in view (swap KIT-A / KIT-B tag every ~5 shots). Junk IS used (shots 29-40). Before you start: hide 5 junk items you have NEVER photographed, they are saved for test01"
    loose: true
    hint: "KIT tag in view; every part countable by eye"
    mix: {complete: 28, foreign_object: 12, missing_nut: 3, missing_bolt: 2, missing_screw: 2, extra_part: 3}
    pauses:
      1: "NUTS TOUCHING PARTS (shots 1-10): a nut on a bolt head, on a shaft, standing on its edge against a part"
      11: "TWO NUTS STACKED FLAT (shots 11-16): offset so both are countable by eye"
      17: "BOLTS TIP TO TIP or CROSSING (shots 17-22)"
      23: "PLAIN KITS (shots 23-28): move the KIT tag around: different directions, partly up the wall, near parts"
      29: "JUNK ON THE KIT TAG (shots 29-32): coin cell, washer, ring, battery corner lying on the printed letters"
      33: "JUNK TOUCHING THE KIT TAG (shots 33-36)"
      37: "JUNK ELSEWHERE (shots 37-40), touching parts is fine"
      41: "MISSING / EXTRA PARTS (shots 41-50), no junk: KIT tag in view; nuts touching parts again where you can"

  - name: labelval
    split: test           # check for the label rules: does junk ON the label still get caught? Never trained on.
                          # Shoot after v3 is frozen. Score: kit eval --session labelval --label
    setup: "KIT TAG CHECK: KIT-A tag only, normal light, complete kit + one piece of junk on or against the tag every shot"
    hint: "1-4: junk ON the tag's letters, 5-6: TOUCHING the tag"
    mix: {foreign_object: 6}

  - name: test01
    split: test           # THE headline set: normal conditions, frozen model + settings, shot blind, scored ONCE.
                          # Change nothing after seeing its score; a fix means a new set. Score: kit eval --session test01 --label
    setup: "FINAL TEST SET: normal light, KIT-A tag ONLY (a KIT-B tag would be a correct FAIL scored as wrong), fully in view. Drop the parts in from your hand like a packer, don't arrange them"
    loose: true
    hint: "can't count every part by eye? drop again. Junk shots 1-5: the 5 hidden never-seen items"
    mix: {complete: 24, missing_bolt: 3, missing_nut: 3, missing_screw: 3, extra_part: 3, two_faults: 2, foreign_object: 10}

  # ---- Optional: stress and invalid scenes (never trained on; manifest only) ----
  - name: stress_side
    split: test
    tier: stress
    setup: "STRESS: move the lamp off to one side (hard shadows)"
    mix: stress
  - name: stress_offset
    split: test
    tier: stress
    setup: "STRESS: tray placed 5 cm off its mark; some shots partly out of frame"
    mix: stress
  - name: stress_dim
    split: test
    tier: stress
    setup: "STRESS: dim light: room lights off, lamp at its lowest"
    mix: stress
  - name: stress_upright
    split: test
    tier: stress
    setup: "STRESS: normal light; parts standing up"
    hint: "stand 1-2 bolts on their heads and/or a nut on its edge"
    mix: stress
  - name: invalid01
    split: test
    tier: invalid
    setup: "INVALID SCENES: normal light"
    mix: {complete: 10, empty: 5}
    pauses:
      1: "HAND IN FRAME: keep a hand over the tray for each shot"
      6: "LENS PARTLY COVERED: hold a finger or paper over part of the lens"
      11: "NO TRAY: take the tray (and parts) out of view"
  - name: stress_wrong_size
    split: test
    tier: stress
    setup: "STRESS, WRONG SIZE: normal light. Have the smaller screws and nuts from the same pack ready"
    mix: {complete: 5, swap_screw: 5, swap_nut: 5}   # complete = control shots
